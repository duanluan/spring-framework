apply plugin: "maven-publish"
apply plugin: "signing"

publishing {
	publications {
		mavenJava(MavenPublication) {
			pom {
				afterEvaluate {
					name = project.description
					description = "${project.description} (community-maintained fork based on Spring Framework 5.3.39 with selected security backports; not an official Spring release)"
				}
				url = "https://github.com/duanluan/spring-framework"
				organization {
					name = "duanluan"
					url = "https://github.com/duanluan"
				}
				licenses {
					license {
						name = "Apache License, Version 2.0"
						url = "https://www.apache.org/licenses/LICENSE-2.0"
						distribution = "repo"
					}
				}
				scm {
					url = "https://github.com/duanluan/spring-framework"
					connection = "scm:git:https://github.com/duanluan/spring-framework.git"
					developerConnection = "scm:git:ssh://git@github.com/duanluan/spring-framework.git"
				}
				developers {
					developer {
						id = "duanluan"
						name = "duanluan"
						email = "duanluan@outlook.com"
					}
				}
				issueManagement {
					system = "GitHub"
					url = "https://github.com/duanluan/spring-framework/issues"
				}
			}
			versionMapping {
				usage('java-api') {
					fromResolutionResult()
				}
				usage('java-runtime') {
					fromResolutionResult()
				}
			}
		}
	}
	repositories {
		maven {
			name = "centralPortal"
			url = "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
			credentials {
				username = findProperty("centralPortalUsername") ?: System.getenv("CENTRAL_PORTAL_USERNAME") ?: System.getenv("CENTRAL_USERNAME")
				password = findProperty("centralPortalPassword") ?: System.getenv("CENTRAL_PORTAL_PASSWORD") ?: System.getenv("CENTRAL_PASSWORD")
			}
		}
	}
}

signing {
	def signingKey = findProperty("signingKey") ?: System.getenv("SIGNING_KEY")
	def signingPassword = findProperty("signingPassword") ?: System.getenv("SIGNING_PASSWORD")
	required {
		!version.toString().endsWith("-SNAPSHOT") &&
				gradle.taskGraph.allTasks.any { task ->
					task.name.startsWith("publish") && !task.name.contains("MavenLocal")
				}
	}
	if (signingKey && signingPassword) {
		useInMemoryPgpKeys(signingKey.toString(), signingPassword.toString())
	}
	else {
		useGpgCmd()
	}
	sign publishing.publications.mavenJava
}

configureDeploymentRepository(project)

void configureDeploymentRepository(Project project) {
	project.plugins.withType(MavenPublishPlugin.class).all {
		PublishingExtension publishing = project.getExtensions().getByType(PublishingExtension.class);
		if (project.hasProperty("deploymentRepository")) {
			publishing.repositories.maven {
				it.url = project.property("deploymentRepository")
				it.name = "deployment"
			}
		}
	}
}

if (project == rootProject) {
	tasks.register("centralPortalUploadDefaultRepository") {
		group = "publishing"
		description = "Moves artifacts uploaded through the OSSRH Staging API into a user-managed Central Portal deployment."
		doLast {
			def username = findProperty("centralPortalUsername") ?: System.getenv("CENTRAL_PORTAL_USERNAME") ?: System.getenv("CENTRAL_USERNAME")
			def password = findProperty("centralPortalPassword") ?: System.getenv("CENTRAL_PORTAL_PASSWORD") ?: System.getenv("CENTRAL_PASSWORD")
			def namespace = findProperty("centralPortalNamespace") ?: System.getenv("CENTRAL_PORTAL_NAMESPACE") ?: "io.github.duanluan"
			if (!username || !password) {
				throw new GradleException("Central Portal token is required: set centralPortalUsername and centralPortalPassword, or CENTRAL_PORTAL_USERNAME and CENTRAL_PORTAL_PASSWORD.")
			}
			def auth = java.util.Base64.encoder.encodeToString("${username}:${password}".getBytes("UTF-8"))
			def url = new URL("https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/${namespace}?publishing_type=user_managed")
			def connection = url.openConnection()
			connection.setRequestMethod("POST")
			connection.setRequestProperty("Authorization", "Bearer ${auth}")
			connection.setDoOutput(true)
			connection.outputStream.withCloseable { it.write(new byte[0]) }
			def status = connection.responseCode
			if (status < 200 || status >= 300) {
				def body = connection.errorStream != null ? connection.errorStream.getText("UTF-8") : connection.inputStream.getText("UTF-8")
				throw new GradleException("Central Portal upload failed with HTTP ${status}: ${body}")
			}
			logger.lifecycle("Central Portal upload request accepted for namespace ${namespace}.")
		}
	}
}
